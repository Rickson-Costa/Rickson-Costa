name: Atualizar Cards

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths-ignore:
      - "assets/**"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Gerar cards
        uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          USERNAME: Rickson-Costa
          AUTO_PUSH: false

      - name: Copiar cards (tema vue, verde) para assets/
        run: |
          mkdir -p assets
          origem="profile-summary-card-output/vue"
          echo "Conteudo gerado:"; ls -1 "$origem" || true
          cp "$origem/0-profile-details.svg" assets/profile-details.svg
          echo "Copiado para assets/:"; ls -1 assets/

      - name: Commit dos cards
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: atualizar cards de estatisticas"
          file_pattern: "assets/*.svg"
